# Integration tests drive ProbeScheduler.tick() manually with a controllable Clock.
# Keep cached contexts from replenishing connections after their container stops.
spring.datasource.hikari.minimum-idle=0
beatward.probe.scheduling-enabled=false
beatward.notification.scheduling-enabled=false
beatward.heartbeat.scheduling-enabled=false
beatward.cleanup.scheduling-enabled=false
beatward.telegram.bot-token=
beatward.telegram.chat-id=
# Test-only bootstrap account; the password is not used by Phase 4B-1 tests.
beatward.auth.bootstrap-username=test-admin
beatward.auth.bootstrap-password-hash={bcrypt}$2a$12$VswLv87wCxJPl24RAvnFEObuemGowCtSVapPwkPotcd85N/.3CcZ2
