spring:
  application:
    name: beatward
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/beatward}
    username: ${DB_USERNAME:beatward}
    password: ${DB_PASSWORD:beatward}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

beatward:
  probe:
    tick-interval: 1s
    batch-size: 200
    pool-size: 8
    queue-capacity: 100
    scheduling-enabled: true
  heartbeat:
    require-https: ${HEARTBEAT_REQUIRE_HTTPS:false}
    tick-interval: 5s
    batch-size: 100
    scheduling-enabled: true
  cleanup:
    enabled: true
    scheduling-enabled: true
    tick-interval: 1h
    check-result-retention-days: 30
    resolved-incident-retention-days: 90
    batch-size: 1000
    max-batches-per-tick: 50
  auth:
    cookie-secure: ${BEATWARD_AUTH_COOKIE_SECURE:false}
    rate-limit:
      max-keys: ${BEATWARD_AUTH_RATE_LIMIT_MAX_KEYS:10000}
    bootstrap-username: ${BEATWARD_AUTH_BOOTSTRAP_USERNAME:}
    bootstrap-password-hash: ${BEATWARD_AUTH_BOOTSTRAP_PASSWORD_HASH:}

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  # Trust X-Forwarded-* only from Caddy on the edge subnet.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '172\.28\.0\.\d{1,3}'
  servlet:
    session:
      timeout: 30m
      cookie:
        name: BEATWARD_SESSION
        http-only: true
        same-site: lax
        path: /
        secure: ${beatward.auth.cookie-secure:false}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
