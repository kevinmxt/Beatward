services:
  postgres:
    image: postgres:17-alpine
    container_name: beatward-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beatward}
      POSTGRES_USER: ${POSTGRES_USER:-beatward}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beatward}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - beatward-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  beatward-postgres-data:
